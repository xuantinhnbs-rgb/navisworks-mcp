name: Feature request
description: Suggest a new tool or an improvement. / Đề xuất tool mới hoặc cải tiến.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Write in English or Vietnamese — both are fine. / Viết tiếng Anh hay tiếng Việt đều được.

        The README lists what is deliberately **not** supported yet (Clash Detective,
        TimeLiner, Quantification, creating viewpoints and selection sets). Requests for
        those are welcome — say what you would use them for.

  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - New tool
        - Existing tool — more parameters or better output
        - Another Navisworks version
        - Performance
        - Documentation
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the real BIM coordination task, not just the COM call you have in mind.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Is there an existing tool that gets close? Does combining `find_objects` with the appearance tools cover it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed tool or change
      placeholder: |
        Tool name: ...
        Parameters: ...
        Returns: ...
