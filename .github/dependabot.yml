# Dependabot mở PR khi có bản mới cho thư viện Python và cho action của CI.
version: 2
updates:
  # pip quet de quy tu goc: mot lan quet bao ca requirements.txt lan
  # requirements-dev.txt. Khai bao them thu muc con se sinh PR trung.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
